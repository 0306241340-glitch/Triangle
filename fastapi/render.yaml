# Render: chi 1 Web Service (FastAPI). DB la Supabase (Postgres) An da tao,
# KHONG dung Postgres cua Render nua.
# Sau khi Blueprint chay xong, vao Render -> web service -> Environment
# va dat DATABASE_URL = chuoi Transaction pooler cua Supabase
# (vd: postgresql://postgres:MAT-KHAU@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true)
services:
  - type: web
    name: quiz-app-api-fastapi
    env: python
    plan: free
    rootDir: fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
